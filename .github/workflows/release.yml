name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # v4.5.3 — switched from NPM_TOKEN to npm Trusted Publishing (OIDC).
      # The id-token: write permission above is what npm's OIDC validator
      # reads; no NPM_TOKEN secret is used anywhere in this workflow.
      # Trusted-publisher config lives on npmjs.com side:
      #   npmjs.com → @vijaypjavvadi/bdd2pw → Settings → Trusted publishers
      #   organization: javvadivijayprasad
      #   repository:   bdd2pw
      #   workflow:     release.yml
      #   environment:  (blank)
      - name: Publish to npm with provenance (OIDC)
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
